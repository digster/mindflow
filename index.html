    <!--
      The app builds its own DOM in src/ui/. This shell exists so that a browser
      with JavaScript disabled, or a build that failed to load, shows something
      honest instead of a blank white page.
    -->
    <noscript>
      <div class="mf-noscript">
        <h1>MindFlow needs JavaScript</h1>
        <p>
          MindFlow is a client-side drawing tool — it runs entirely in your browser
          and has no server component. Please enable JavaScript to use it.
        </p>
      </div>
